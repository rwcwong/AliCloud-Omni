# Include this file inside the existing Nginx server {} block that serves
# http://8.217.182.207/OminiOS/. It keeps browser requests same-origin, avoiding
# the API service's duplicate CORS headers.

location ^~ /api/ {
    proxy_pass http://8.217.182.207:8888;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /static/ {
    proxy_pass http://8.217.182.207:8888;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /omnios-ws-node-1/ {
    proxy_pass http://8.217.182.207:8081/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $proxy_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

location ^~ /omnios-ws-node-2/ {
    proxy_pass http://8.217.182.207:8082/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $proxy_host;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
